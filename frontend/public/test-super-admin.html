<!DOCTYPE html>
<html>
<head>
  <title>Test Super Admin Navigation</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { padding: 10px; margin: 5px; background: #3b82f6; color: white; border: none; cursor: pointer; }
    button:hover { background: #2563eb; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; white-space: pre-wrap; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>🔍 Test Super Admin Navigation</h1>
  
  <div>
    <button onclick="step1()">Step 1: Check LocalStorage</button>
    <button onclick="step2()">Step 2: Test API Direct</button>
    <button onclick="step3()">Step 3: Navigate to /super-admin/users</button>
  </div>
  
  <pre id="output">Click Step 1 to start...</pre>

  <script>
    const API_BASE = 'http://127.0.0.1:8000/api';
    
    function step1() {
      const output = document.getElementById('output');
      const token = localStorage.getItem('token');
      const user = localStorage.getItem('user');
      
      let result = '=== STEP 1: CHECK LOCALSTORAGE ===\n\n';
      
      result += `Token: ${token ? '✅ EXISTS' : '❌ MISSING'}\n`;
      if (token) result += `  Length: ${token.length} chars\n`;
      
      result += `\nUser: ${user ? '✅ EXISTS' : '❌ MISSING'}\n`;
      
      if (user) {
        try {
          const parsed = JSON.parse(user);
          result += `\nParsed User:\n${JSON.stringify(parsed, null, 2)}\n`;
          result += `\n✅ Role: "${parsed.role}"\n`;
          result += `   Is super_admin: ${parsed.role === 'super_admin'}\n`;
          
          if (parsed.role !== 'super_admin') {
            result += '\n❌ PROBLEM: You are not logged in as super_admin!\n';
            result += '   Please login with: superadmin@sitara.com / password123\n';
          } else {
            result += '\n✅ You are logged in as super_admin. Proceed to Step 2.\n';
          }
        } catch (e) {
          result += `\n❌ ERROR parsing user: ${e.message}\n`;
        }
      } else {
        result += '\n❌ You need to login first!\n';
      }
      
      output.textContent = result;
    }
    
    async function step2() {
      const output = document.getElementById('output');
      const token = localStorage.getItem('token');
      
      if (!token) {
        output.textContent = '❌ No token found. Login first!';
        return;
      }
      
      output.textContent = '=== STEP 2: TEST API DIRECT ===\n\nTesting /api/super-admin/users...\n';
      
      try {
        const response = await fetch(`${API_BASE}/super-admin/users`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/json'
          }
        });
        
        const data = await response.json();
        
        let result = '=== STEP 2: API RESPONSE ===\n\n';
        result += `Status: ${response.status} ${response.statusText}\n\n`;
        
        if (response.ok) {
          result += '✅ API WORKS! Backend returns data:\n\n';
          result += JSON.stringify(data, null, 2);
          result += '\n\n✅ Backend is OK. Problem is in frontend routing.\n';
          result += 'Proceed to Step 3 to test navigation.\n';
        } else {
          result += '❌ API ERROR:\n\n';
          result += JSON.stringify(data, null, 2);
          result += '\n\n❌ Backend is blocking access. Check role middleware.\n';
        }
        
        output.textContent = result;
      } catch (e) {
        output.textContent = `❌ Network error: ${e.message}`;
      }
    }
    
    function step3() {
      console.log('🔍 Attempting navigation to /super-admin/users');
      console.log('Current location:', window.location.href);
      console.log('Token:', localStorage.getItem('token') ? 'EXISTS' : 'MISSING');
      console.log('User:', localStorage.getItem('user'));
      
      // Direct navigation
      window.location.href = '/super-admin/users';
    }
  </script>
</body>
</html>
